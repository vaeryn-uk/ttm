[project]
name = "ttm"
version = "0.1.0"
description = "A quick SQLite-backed MCP server for todo and task management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0.0",
  "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ttm = "ttm.__main__:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
